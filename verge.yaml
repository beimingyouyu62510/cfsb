# 名称: Agnes_Smart-Pro (全场景精细分流版 - Clash Verge Rev 优化版)
# 一、基础网络设置
mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 9797
tproxy-port: 9898
ipv6: true
udp: true
mode: rule
allow-lan: true
bind-address: '*'

# 二、性能与连接优化
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 600
unified-delay: true
tcp-concurrent: true
log-level: error
find-process-mode: strict

# 三、GeoIP & GeoSite 数据库
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip:   "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb:    "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
  asn:     "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

# 四、LightGBM 智能节点模型
lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

# 五、请求头伪装
experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Windows NT 10.0; WOW64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.7115.98 Safari/537.36 Edg/134.0.3348.109"

# 六、外部控制面板
external-controller: 127.0.0.1:9090
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./dashboard"
secret: ""

# 七、节点记忆与持久化缓存
profile:
  store-selected: true
  store-fake-ip: true
  cache-file: ./cache.db

# 八、流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    QUIC: { ports: [443, 8443] }
    TLS:  { ports: [443, 8443] }
    HTTP: { ports: [80, 8080-8880], override-destination: true }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.hbo.com"
    - "+.hbomaxcdn.com"
    - "+.tiktok.com"
    - "+.disneyplus.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.oray.com"
    
# 九、TUN 模式（针对 Windows 桌面端优化）
tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true

# 十、DNS 模块（切换为 Fake-IP 模式以全面适配 Windows）
dns:
  enable: true
  ipv6: true
  respect-rules: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::/48
  fake-ip-filter:
    - "rule-set:CN_域"
    - "rule-set:Private"
    - "rule-set:GoogleFCM"
    - "+.3gppnetwork.org"
    - "+.xtracloud.net"
  proxy-server-nameserver:
    - https://223.5.5.5:443/dns-query
    - https://1.12.12.12:443/dns-query
  nameserver-policy:
    "rule-set:CN_域":
      - https://223.5.5.5:443/dns-query
      - https://1.12.12.12:443/dns-query
  nameserver:
    - https://8.8.8.8:443/dns-query
    - https://1.1.1.1:443/dns-query
  direct-nameserver:
    - 223.5.5.5
    - 1.12.12.12

# 十一、订阅提供者基础模板（完全保留原样）
BaseProvider: &BaseProvider
  type: http
  interval: 86400
  proxy: 订阅下载
  health-check:
    enable: true
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    timeout: 3000

# 十二、代理订阅组（完全保留原样）
proxy-providers:
  proxy:
    type: http
    url: "https://raw.githubusercontent.com/beimingyouyu62510/cfsb/refs/heads/main/nodes.yaml"
    path: proxy_provider/proxy.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 300
      timeout: 1000
      tolerance: 100
proxies:
  - {name: 🎯 本地直连, type: direct, udp: true}
  - {name: ⛔ 拒绝连接, type: reject}
  - {name: DNS_Hijack, type: dns}

# 十四、节点筛选正则表达式（完全保留原样）
FilterHK: &FilterHK '^(?i).*(港|🇭🇰|Hong|HKG|HK\d+|HK[-_ ]?\d*).*$'
FilterJP: &FilterJP '^(?i).*(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK).*$'
FilterSG: &FilterSG '^(?i).*(坡|🇸🇬|Sing|SIN|SG\d+|SG[-_ ]?\d*|XSP).*$'
FilterUS: &FilterUS '^(?i).*(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD).*$'
FilterEU: &FilterEU '^(?is)(?!.*(🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇹🇼|🇰🇷|🇨🇳|港|日|坡|美|台|韩|中国|北京|上海|广州|深圳|\bCN\b)).*$'

# 十五、策略模板（完全保留原样）
AppGroupTemplate: &AppGroupTemplate
  type: select
  proxies: [ 节点选择,手动选择, 自动选择, 其他节点, 🎯 本地直连 ]

# 十六、代理策略组（完全保留原样）
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [ 自动选择, 负载均衡, 故障转移, 手动选择, 其他节点, 🎯 本地直连 ]

  - name: 订阅下载
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]

  - name: 自动选择
    type: url-test
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    include-all-providers: true

  - name: 手动选择
    type: select
    include-all-providers: true

  - name: 负载均衡
    type: load-balance
    strategy: round-robin
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    include-all-providers: true

  - name: 故障转移
    type: fallback
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    include-all-providers: true

  - name: 其他节点
    type: fallback
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
    filter: *FilterEU
    include-all-providers: true

  - name: AI 平台
    <<: *AppGroupTemplate
  - name: YouTube
    <<: *AppGroupTemplate
  - name: Google
    <<: *AppGroupTemplate
  - name: GoogleFCM
    <<: *AppGroupTemplate
  - name: Netflix
    <<: *AppGroupTemplate
  - name: TikTok
    <<: *AppGroupTemplate
  - name: Telegram
    <<: *AppGroupTemplate
  - name: Twitter
    <<: *AppGroupTemplate
  - name: Github
    <<: *AppGroupTemplate
  - name: Emby
    <<: *AppGroupTemplate
  - name: 国外媒体
    <<: *AppGroupTemplate
  - name: 游戏平台
    <<: *AppGroupTemplate
  - name: Microsoft
    <<: *AppGroupTemplate
  - name: Apple
    <<: *AppGroupTemplate
  - name: 抖音定位
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]
  - name: 哔哩哔哩
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]
  - name: 国内游戏
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]
  - name: 国内连接
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]
  - name: BT下载
    type: select
    proxies: [ 🎯 本地直连, 节点选择 ]
  - name: 广告拦截
    type: select
    proxies: [ ⛔ 拒绝连接, REJECT-DROP, DNS_Hijack, PASS ]
  - name: 漏网之鱼
    <<: *AppGroupTemplate

